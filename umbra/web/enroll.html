<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Umbra — enroll</title>
  <link rel="stylesheet" href="/style.css?v=qa5">
</head>
<body>
<main>
  <h1>Enroll</h1>
  <nav class="muted"><a href="/">Sign in</a></nav>
  <p class="muted" id="enrollHint">One category at a time. Begin sign up to open the camera.</p>
  <section class="card">
    <div class="row" id="startRow">
      <input type="text" id="pid" placeholder="name or id (optional)" autocomplete="off">
      <button type="button" id="begin">Begin sign up</button>
    </div>
    <div id="stage" hidden>
      <video id="camPreview" class="mirror" playsinline muted autoplay></video>
      <div id="guide" hidden><div class="oval"></div></div>
    </div>
    <p id="script" class="card" hidden></p>
    <div class="row" id="actRow">
      <button type="button" id="snapFace" hidden>Capture face</button>
      <button type="button" id="recVoice" hidden>Record voice</button>
      <label class="file" id="voiceFileLab" hidden for="voiceFile">Choose voice file</label>
      <input type="file" id="voiceFile" accept="audio/*,.wav,.m4a,.mp3,.aac,.caf" hidden>
      <button type="button" id="skipVoice" hidden>dev mode: skip voice</button>
      <button type="button" id="snapFinger" hidden>Capture finger</button>
      <button type="button" id="skipFinger" hidden>dev mode: skip finger</button>
    </div>
    <div id="recDeck" hidden>
      <div class="rec-top">
        <span class="rec-dot" aria-hidden="true"></span>
        <strong id="recLabel">Recording</strong>
        <span id="recTime">0:00</span>
        <button type="button" id="stopVoice">Stop</button>
      </div>
      <canvas id="recWave" width="640" height="56"></canvas>
    </div>
    <p id="voiceDone" class="card" hidden>Finished. Play it back, then save encrypted.</p>
    <audio id="voicePlay" controls hidden></audio>
    <div class="row" id="afterRow" hidden>
      <button type="button" id="doEnroll">Save encrypted</button>
      <button type="button" id="clearCat">Clear category</button>
    </div>
    <p class="muted" id="enrollCounts"></p>
    <div class="thumbs" id="thumbs"></div>
    <p class="muted" id="rosterLine">Roster: none yet</p>
    <p id="err"></p>
  </section>
</main>
<script src="/umbra.js?v=qa5"></script>
<script>
const FACE_POSES = ["front", "left", "right"];
const FACE_HINT = ["Look straight at the camera", "Turn your head left", "Turn your head right"];
const PASSAGE =
  "When the sunlight strikes raindrops in the air, they act as a prism and form a rainbow. " +
  "The rainbow is a division of white light into many beautiful colors. " +
  "These take the shape of a long round arch, with its path high above, and its two ends apparently beyond the horizon. " +
  "The birch canoe slid on the smooth planks. Glue the sheet to the dark blue background. " +
  "It is easy to tell the depth of a well. These days a chicken leg is a rare dish.";
const FACE_NEED = 3;
const VOICE_NEED = 1;
const VOICE_MIN_MS = 8000;
const VOICE_MS = 16000;
const bag = {face: [], voice: [], print: []};
let stream = null;
let step = "start";
let voiceUI = "idle";
let playUrl = null;
let enrolledId = null;
let recClock = null;
let recStarted = 0;
let voiceTok = 0;
let qaBusy = false;

function showErr(e) {
  document.getElementById("err").textContent = String(e && e.message ? e.message : e);
}

function hide(el, on) {
  if (el) el.hidden = !!on;
}

function paintThumbs(kind) {
  const box = document.getElementById("thumbs");
  box.innerHTML = "";
  (bag[kind] || []).forEach((b) => {
    if (!b.type || !b.type.startsWith("image/")) return;
    const img = document.createElement("img");
    img.src = URL.createObjectURL(b);
    box.appendChild(img);
  });
}

function setPlayback(blob) {
  const a = document.getElementById("voicePlay");
  if (playUrl) URL.revokeObjectURL(playUrl);
  playUrl = blob ? URL.createObjectURL(blob) : null;
  a.src = playUrl || "";
  hide(a, !playUrl);
}

function stopCam() {
  if (stream) {
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }
  const v = document.getElementById("camPreview");
  v.srcObject = null;
  hide(document.getElementById("stage"), true);
  hide(document.getElementById("guide"), true);
}

function render() {
  const startRow = document.getElementById("startRow");
  const after = document.getElementById("afterRow");
  const script = document.getElementById("script");
  const recDeck = document.getElementById("recDeck");
  document.getElementById("thumbs").innerHTML = "";
  hide(document.getElementById("snapFace"), true);
  hide(document.getElementById("recVoice"), true);
  hide(document.getElementById("voiceFileLab"), true);
  hide(document.getElementById("skipVoice"), true);
  hide(document.getElementById("snapFinger"), true);
  hide(document.getElementById("skipFinger"), true);
  hide(script, true);
  hide(after, true);
  hide(document.getElementById("voiceDone"), true);
  hide(document.getElementById("voicePlay"), true);
  if (voiceUI !== "rec") hide(recDeck, true);
  if (step === "start") {
    hide(startRow, false);
    document.getElementById("enrollHint").textContent = "Begin sign up opens the camera. Then face, voice, finger — one at a time.";
    document.getElementById("enrollCounts").textContent = "";
    setPlayback(null);
    return;
  }
  hide(startRow, true);
  if (step === "face") {
    const n = bag.face.length;
    const ready = n >= FACE_NEED;
    hide(document.getElementById("snapFace"), ready);
    hide(after, !ready);
    hide(document.getElementById("guide"), ready);
    document.getElementById("enrollHint").textContent = ready
      ? "Three angles saved. Save encrypted to continue, or clear category to redo faces."
      : `Face ${n + 1} of ${FACE_NEED}: ${FACE_HINT[n]}. Fill the oval — close, centered, well lit.`;
    document.getElementById("enrollCounts").textContent = `${n} / ${FACE_NEED} faces`;
    paintThumbs("face");
    return;
  }
  if (step === "voice") {
    hide(document.getElementById("guide"), true);
    const ready = voiceUI === "done" || bag.voice.length >= VOICE_NEED;
    hide(script, false);
    script.textContent = PASSAGE;
    hide(recDeck, voiceUI !== "rec");
    hide(document.getElementById("recVoice"), voiceUI !== "idle");
    hide(document.getElementById("voiceFileLab"), voiceUI === "done");
    hide(document.getElementById("skipVoice"), false);
    hide(document.getElementById("voiceDone"), voiceUI !== "done");
    hide(after, voiceUI !== "done");
    hide(document.getElementById("voicePlay"), voiceUI !== "done");
    document.getElementById("enrollHint").textContent = voiceUI === "rec"
      ? "Recording — read the passage. Need 8s of clear speech. Stop when you finish, or wait ~16s."
      : voiceUI === "done"
        ? "Finished. Play it back, then save encrypted."
        : "Read the passage for at least 8 seconds — or choose a voice file.";
    document.getElementById("enrollCounts").textContent = voiceUI === "done" ? "1 passage" : "0 / 1 passage";
    paintThumbs("voice");
    return;
  }
  if (step === "finger") {
    hide(document.getElementById("guide"), true);
    const n = bag.print.length;
    const ready = n >= 1;
    hide(document.getElementById("snapFinger"), ready);
    hide(document.getElementById("skipFinger"), ready);
    hide(after, !ready);
    document.getElementById("enrollHint").textContent = ready
      ? "Finger saved. Save encrypted to store this person, or clear category to recapture."
      : "Hold one fingertip close to the camera until it fills the frame, then capture.";
    document.getElementById("enrollCounts").textContent = `${n} finger`;
    return;
  }
  document.getElementById("enrollHint").textContent = enrolledId
    ? `Enrolled user ${enrolledId}`
    : "Enrolled. You can sign in.";
  document.getElementById("enrollCounts").textContent = enrolledId
    ? "Save this number to sign in later."
    : "";
}

async function rosterLine() {
  try {
    const {people} = await Umbra.roster();
    document.getElementById("rosterLine").textContent = people.length
      ? "Roster: " + people.map(p => `${p.id} (${p.face}f ${p.voice}v ${p.print}p)`).join(", ")
      : "Roster: none yet";
  } catch (e) {
    document.getElementById("rosterLine").textContent = String(e.message || e);
  }
}

function encodeWav(float32, rate) {
  const n = float32.length;
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const ascii = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ascii(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); ascii(8, "WAVE"); ascii(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); ascii(36, "data");
  v.setUint32(40, n * 2, true);
  let o = 44;
  for (let i = 0; i < n; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], {type: "audio/wav"});
}

function newCtx() {
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) throw new Error("this browser has no AudioContext");
  return new C();
}

function paintLevel(samples) {
  const c = document.getElementById("recWave");
  const g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const bars = 40;
  const bw = c.width / bars;
  for (let i = 0; i < bars; i++) {
    const v = Math.abs(samples[Math.floor(i * samples.length / bars)] || 0);
    const h = Math.max(3, v * c.height);
    g.fillStyle = v > 0.08 ? "#3dba7a" : "#2a2b30";
    g.fillRect(i * bw + 1, (c.height - h) / 2, bw - 2, h);
  }
}

function startClock() {
  stopClock();
  const el = document.getElementById("recTime");
  recStarted = Date.now();
  const t0 = recStarted;
  el.textContent = "0:00";
  recClock = setInterval(() => {
    const s = Math.min(99, Math.floor((Date.now() - t0) / 1000));
    el.textContent = `0:${String(s).padStart(2, "0")}`;
  }, 200);
}

function stopClock() {
  if (recClock) clearInterval(recClock);
  recClock = null;
}

async function openCam() {
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("Camera is blocked on this URL. Use http://127.0.0.1:8765/enroll");
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: true, audio: false});
  } catch (e) {
    stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true}).catch(() => { throw e; });
  }
  const v = document.getElementById("camPreview");
  v.muted = true;
  v.playsInline = true;
  v.srcObject = new MediaStream(stream.getVideoTracks());
  hide(document.getElementById("stage"), false);
  hide(document.getElementById("guide"), false);
  try { await v.play(); } catch (e) { showErr(e); }
}

// Live QA: oval goes green (#guide.ok) only while Vision sees a face for the pose we are asking for.
// Advisory only — snap() never waits on it.
async function tickQa() {
  if (qaBusy || !stream || step !== "face" || bag.face.length >= FACE_NEED) return;
  qaBusy = true;
  const guide = document.getElementById("guide");
  try {
    const blob = await Umbra.grabCover(document.getElementById("camPreview"));
    const q = blob ? await Umbra.qaFace(blob, FACE_POSES[bag.face.length] || "front") : null;
    guide.classList.toggle("ok", !!(q && q.ok && q.face));
  } catch (e) {
    guide.classList.remove("ok");
  } finally {
    qaBusy = false;
  }
}

// Capture always saves the current cover-crop frame. QA is the live oval, not a gate.
async function snap(kind) {
  const v = document.getElementById("camPreview");
  if (!v.srcObject) throw new Error("camera is not on");
  const blob = await Umbra.grabCover(v);
  if (!blob) throw new Error("no frame yet — wait a moment and try again");
  bag[kind].push(blob);
  render();
}

function dummyPrint() {
  const c = document.createElement("canvas");
  c.width = 320; c.height = 240;
  const g = c.getContext("2d");
  g.fillStyle = "#777";
  g.fillRect(0, 0, 320, 240);
  return new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
}

async function skipFinger() {
  const blob = await dummyPrint();
  if (!blob) throw new Error("skip finger failed");
  bag.print = [blob];
  return saveEncrypted();
}

function skipVoice() {
  const n = 16000;
  const f = new Float32Array(n);
  for (let i = 0; i < n; i++) f[i] = 0.08 * Math.sin(2 * Math.PI * 220 * i / 16000);
  bag.voice = [encodeWav(f, 16000)];
  voiceTok += 1;
  stopClock();
  document.getElementById("stopVoice").onclick = null;
  voiceUI = "idle";
  setPlayback(null);
  step = "finger";
  render();
}

function acceptVoice(wav) {
  voiceTok += 1;
  stopClock();
  document.getElementById("stopVoice").onclick = null;
  bag.voice = [wav];
  setPlayback(wav);
  voiceUI = "done";
  render();
}

async function fileToWav(file) {
  const ctx = newCtx();
  await ctx.resume();
  const buf = await ctx.decodeAudioData(await file.arrayBuffer());
  const wav = encodeWav(buf.getChannelData(0), buf.sampleRate);
  await ctx.close();
  if (!wav || wav.size < 1000) throw new Error("that audio file is empty");
  return wav;
}

function pcmToWav(pcm, rate) {
  if (!pcm.length) return null;
  const n = pcm.reduce((a, b) => a + b.length, 0);
  if (!n) return null;
  const f = new Float32Array(n);
  let o = 0;
  pcm.forEach((b) => { f.set(b, o); o += b.length; });
  return encodeWav(f, rate);
}

async function recordVoice() {
  const tok = ++voiceTok;
  showErr("");
  voiceUI = "rec";
  render();
  document.getElementById("recLabel").textContent = "Recording";
  document.getElementById("stopVoice").textContent = "Stop";
  startClock();
  let endRec;
  const stopped = new Promise((r) => { endRec = r; });
  document.getElementById("stopVoice").onclick = endRec;
  const auto = setTimeout(endRec, VOICE_MS);
  let ctx = null;
  try { ctx = newCtx(); ctx.resume(); } catch (e) { ctx = null; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    clearTimeout(auto);
    throw new Error("no mic — use Choose voice file");
  }
  const gum = navigator.mediaDevices.getUserMedia({audio: true, video: false});
  gum.then((s) => { if (tok !== voiceTok) s.getTracks().forEach((t) => t.stop()); }).catch(() => {});
  const mic = await Promise.race([gum, stopped.then(() => null)]);
  if (tok !== voiceTok) {
    if (mic) mic.getTracks().forEach((t) => t.stop());
    return;
  }
  const pcm = [];
  let proc = null, rec = null, rate = (ctx && ctx.sampleRate) || 48000;
  const chunks = [];
  if (mic && ctx) {
    try {
      rate = ctx.sampleRate || rate;
      const src = ctx.createMediaStreamSource(mic);
      const mute = ctx.createGain();
      mute.gain.value = 0;
      proc = ctx.createScriptProcessor(4096, 1, 1);
      proc.onaudioprocess = (e) => {
        const s = e.inputBuffer.getChannelData(0);
        pcm.push(new Float32Array(s));
        paintLevel(s);
      };
      src.connect(proc);
      proc.connect(mute);
      mute.connect(ctx.destination);
    } catch (e) {
      proc = null;
    }
  }
  if (mic) {
    try {
      rec = new MediaRecorder(mic);
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.start(200);
    } catch (e) {
      rec = null;
    }
  }
  await stopped;
  clearTimeout(auto);
  if (tok !== voiceTok) {
    if (mic) mic.getTracks().forEach((t) => t.stop());
    return;
  }
  stopClock();
  if (rec && rec.state !== "inactive") {
    try { rec.requestData(); } catch (e) {}
    await Promise.race([
      new Promise((r) => { rec.onstop = r; rec.stop(); }),
      new Promise((r) => setTimeout(r, 800)),
    ]);
  }
  if (proc) try { proc.disconnect(); } catch (e) {}
  if (ctx) try { await ctx.close(); } catch (e) {}
  if (mic) mic.getTracks().forEach((t) => t.stop());
  if (tok !== voiceTok) return;
  if (Date.now() - recStarted < VOICE_MIN_MS) throw new Error("keep talking — need 8 seconds of clear speech");
  let wav = pcmToWav(pcm, rate);
  if ((!wav || wav.size < 44 + 2) && chunks.length) {
    try {
      const dec = newCtx();
      dec.resume();
      const buf = await dec.decodeAudioData(await new Blob(chunks).arrayBuffer());
      wav = encodeWav(buf.getChannelData(0), buf.sampleRate);
      await dec.close();
    } catch (e) {
      wav = null;
    }
  }
  if (!wav || wav.size < 44 + 2) throw new Error("no audio — speak, or use Choose voice file");
  const q = await Umbra.qaVoice(wav);
  if (!q.ok) throw new Error(q.reason || "voice quality");
  acceptVoice(wav);
}

function clearCategory() {
  if (step === "face") bag.face = [];
  if (step === "voice") {
    bag.voice = [];
    voiceUI = "idle";
    setPlayback(null);
  }
  if (step === "finger") bag.print = [];
  render();
}

async function saveEncrypted() {
  if (step === "face") {
    if (bag.face.length < FACE_NEED) throw new Error("need 3 face angles");
    voiceUI = "idle";
    step = "voice";
    render();
    return;
  }
  if (step === "voice") {
    if (voiceUI !== "done" || bag.voice.length < VOICE_NEED) throw new Error("need the voice passage");
    voiceUI = "idle";
    setPlayback(null);
    step = "finger";
    render();
    return;
  }
  if (step !== "finger") return;
  if (!bag.print.length) throw new Error("need a finger close-up");
  const fd = new FormData();
  bag.face.forEach((b, i) => fd.append("face", b, `face${i}.jpg`));
  bag.voice.forEach((b, i) => fd.append("voice", b, `voice${i}.wav`));
  bag.print.forEach((b, i) => fd.append("print", b, `print${i}.jpg`));
  const out = await Umbra.enroll(fd);
  enrolledId = out.id;
  stopCam();
  location.assign("/?enrolled=" + encodeURIComponent(out.id));
}

document.getElementById("begin").onclick = () => openCam().then(() => { step = "face"; render(); }).catch(showErr);
document.getElementById("snapFace").onclick = () => snap("face").catch(showErr);
document.getElementById("snapFinger").onclick = () => snap("print").catch(showErr);
document.getElementById("recVoice").onclick = () => recordVoice().catch((e) => {
  voiceTok += 1;
  stopClock();
  showErr(e);
  document.getElementById("recLabel").textContent = "Couldn’t record";
  const btn = document.getElementById("stopVoice");
  btn.textContent = "Retry";
  btn.onclick = () => recordVoice().catch((err) => showErr(err));
});
document.getElementById("skipVoice").onclick = () => skipVoice();
document.getElementById("skipFinger").onclick = () => skipFinger().catch(showErr);
document.getElementById("voiceFile").onchange = (ev) => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!f) return;
  fileToWav(f).then(async (wav) => {
    const q = await Umbra.qaVoice(wav);
    if (!q.ok) throw new Error(q.reason || "voice quality");
    acceptVoice(wav);
  }).catch(showErr);
};
document.getElementById("clearCat").onclick = () => clearCategory();
document.getElementById("doEnroll").onclick = () => saveEncrypted().catch(showErr);
rosterLine();
render();
setInterval(tickQa, 400);
</script>
</body>
</html>
