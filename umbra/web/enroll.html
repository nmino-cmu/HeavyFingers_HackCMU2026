<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Umbra — enroll</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css?v=chill3">
</head>
<body class="desktop face-page" data-bg="face">
<div data-umbra-bg></div>
<div class="desk face-desk">
  <article class="win face-wire" data-win="enroll" data-win-preset="face">
    <div class="win-bar face-wire-bar">
      <h2>Face</h2>
      <div class="win-chrome">
        <button type="button" data-win-min aria-label="Minimize">-</button>
        <a class="win-btn face-x" href="index.html" aria-label="Close">X</a>
      </div>
    </div>
    <p id="script" class="card" hidden></p>
    <div id="recDeck" hidden>
      <div class="rec-top">
        <span class="rec-dot" aria-hidden="true"></span>
        <strong id="recLabel">Recording</strong>
        <span id="recTime">0:00</span>
        <button type="button" id="stopVoice">Stop</button>
      </div>
      <canvas id="recWave" width="640" height="56"></canvas>
    </div>
    <div class="face-view" id="stage">
      <video id="camPreview" class="mirror" playsinline muted autoplay></video>
      <div id="guide" hidden><div class="oval"></div></div>
      <img class="oval-asset" src="assets/oval.svg?v=pretty2" width="417" height="535" alt="">
    </div>
    <div class="face-foot">
      <p class="muted" id="enrollHint">One category at a time. Begin sign up to open the camera.</p>
      <div class="face-btns" id="startRow">
        <input type="text" id="pid" placeholder="name or id (optional)" autocomplete="off">
        <button type="button" id="begin">Begin sign up</button>
        <button type="button" id="snapFace" hidden>Capture face</button>
        <button type="button" id="recVoice" hidden>Record voice</button>
        <label class="file" id="voiceFileLab" hidden for="voiceFile">Choose voice file</label>
        <button type="button" id="doEnroll" hidden>Save encrypted</button>
        <button type="button" id="clearCat" hidden>Clear category</button>
        <button type="button" id="enter" hidden>Enter</button>
      </div>
    </div>
    <input type="file" id="voiceFile" accept="audio/*,.wav,.m4a,.mp3,.aac,.caf" hidden>
    <p id="voiceDone" class="card" hidden>Finished. Play it back, then save encrypted.</p>
    <audio id="voicePlay" controls hidden></audio>
    <div class="thumbs" id="thumbs"></div>
    <div class="face-meta">
      <p class="muted" id="enrollCounts"></p>
      <p class="muted" id="rosterLine">Roster: none yet</p>
      <div class="lights" id="lights"></div>
      <p id="err"></p>
      <div class="seal-viz" id="seal" hidden></div>
    </div>
    <div class="win-resize" aria-hidden="true"></div>
  </article>
</div>
<script src="umbra.js?v=pass2"></script>
<script src="vendor/grain.js?v=chill3"></script>
<script src="windows.js?v=chill3"></script>
<script>
const FACE_POSES = ["front", "front", "front"];
const FACE_HINT = ["Look straight at the camera", "Hold still, still looking straight", "One more straight-on, same light"];
const PASSAGE =
  "When the sunlight strikes raindrops in the air, they act as a prism and form a rainbow. " +
  "The rainbow is a division of white light into many beautiful colors. " +
  "These take the shape of a long round arch, with its path high above, and its two ends apparently beyond the horizon. " +
  "The birch canoe slid on the smooth planks. Glue the sheet to the dark blue background. " +
  "It is easy to tell the depth of a well. These days a chicken leg is a rare dish.";
const FACE_NEED = 3;
const VOICE_NEED = 1;
const VOICE_MIN_MS = 12000;
const VOICE_MS = 20000;
const bag = {face: [], voice: []};
let stream = null;
let step = "start";
let voiceUI = "idle";
let playUrl = null;
let enrolledId = null;
let recClock = null;
let recStarted = 0;
let voiceTok = 0;
let qaBusy = false;
let readFaces = [];
let readGrab = null;
const READ_FACE_MAX = 8;
const READ_FACE_MS = 800;

function stopReadGrabs() {
  if (readGrab) clearInterval(readGrab);
  readGrab = null;
}

function showErr(e) {
  const msg = String(e && e.message ? e.message : e || "");
  document.getElementById("err").textContent = msg;
  if (e) console.error(msg);
}

function hide(el, on) {
  if (el) el.hidden = !!on;
}

function paintThumbs(kind) {
  const box = document.getElementById("thumbs");
  box.innerHTML = "";
  (bag[kind] || []).forEach((b) => {
    if (!b.type || !b.type.startsWith("image/")) return;
    const img = document.createElement("img");
    img.src = URL.createObjectURL(b);
    box.appendChild(img);
  });
}

function setPlayback(blob) {
  const a = document.getElementById("voicePlay");
  if (playUrl) URL.revokeObjectURL(playUrl);
  playUrl = blob ? URL.createObjectURL(blob) : null;
  a.src = playUrl || "";
  hide(a, !playUrl);
}

function stopCam() {
  if (stream) {
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }
  const v = document.getElementById("camPreview");
  if (v) v.srcObject = null;
  hide(document.getElementById("guide"), true);
}

function render() {
  const script = document.getElementById("script");
  const recDeck = document.getElementById("recDeck");
  document.getElementById("thumbs").innerHTML = "";
  hide(document.getElementById("pid"), true);
  hide(document.getElementById("begin"), true);
  hide(document.getElementById("snapFace"), true);
  hide(document.getElementById("recVoice"), true);
  hide(document.getElementById("voiceFileLab"), true);
  hide(document.getElementById("doEnroll"), true);
  hide(document.getElementById("clearCat"), true);
  hide(document.getElementById("enter"), step !== "done");
  hide(script, true);
  hide(document.getElementById("voiceDone"), true);
  hide(document.getElementById("voicePlay"), true);
  if (voiceUI !== "rec") hide(recDeck, true);
  document.getElementById("stage").classList.toggle("short", step === "voice");
  document.getElementById("stage").classList.toggle("rest",
    (step === "face" && bag.face.length > 0) || (step === "voice" && voiceUI === "done"));
  if (step === "start") {
    hide(document.getElementById("pid"), false);
    hide(document.getElementById("begin"), false);
    document.getElementById("enrollHint").textContent = "Begin sign up opens the camera. Then face, then voice — one at a time.";
    document.getElementById("enrollCounts").textContent = "";
    setPlayback(null);
    return;
  }
  if (step === "face") {
    const n = bag.face.length;
    const ready = n >= FACE_NEED;
    hide(document.getElementById("snapFace"), ready);
    hide(document.getElementById("doEnroll"), !ready);
    hide(document.getElementById("clearCat"), !ready);
    hide(document.getElementById("guide"), ready);
    document.getElementById("enrollHint").textContent = ready
      ? "Three stills saved. Next you’ll read on camera — same gaze as sign-in."
      : `Face ${n + 1} of ${FACE_NEED}: ${FACE_HINT[n]}. Fill the oval — close, centered, well lit.`;
    document.getElementById("enrollCounts").textContent = `${n} / ${FACE_NEED} faces`;
    paintThumbs("face");
    return;
  }
  if (step === "voice") {
    hide(document.getElementById("guide"), voiceUI === "done");
    hide(script, false);
    script.textContent = PASSAGE;
    hide(recDeck, voiceUI !== "rec");
    hide(document.getElementById("recVoice"), voiceUI !== "idle");
    hide(document.getElementById("voiceFileLab"), voiceUI === "done");
    hide(document.getElementById("voiceDone"), voiceUI !== "done");
    hide(document.getElementById("doEnroll"), voiceUI !== "done");
    hide(document.getElementById("clearCat"), voiceUI !== "done");
    hide(document.getElementById("voicePlay"), voiceUI !== "done");
    document.getElementById("enrollHint").textContent = voiceUI === "rec"
      ? "Eyes on the passage — keep reading for 12 seconds of speech. Face stays in the oval."
      : voiceUI === "done"
        ? "Finished. Play it back, then save encrypted."
        : "Read the passage above the camera for at least 12 seconds of clear speech.";
    document.getElementById("enrollCounts").textContent = voiceUI === "done" ? "1 passage" : "0 / 1 passage";
    paintThumbs("voice");
    return;
  }
  document.getElementById("enrollHint").textContent = enrolledId
    ? `Enrolled user ${enrolledId}`
    : "Enrolled. You can sign in.";
  document.getElementById("enrollCounts").textContent = enrolledId
    ? "Save this number to sign in later."
    : "";
}

async function rosterLine() {
  try {
    const {people} = await Umbra.roster();
    document.getElementById("rosterLine").textContent = people.length
      ? "Roster: " + people.map(p => `${p.id} (${p.face}f ${p.voice}v ${p.print}p)`).join(", ")
      : "Roster: none yet";
  } catch (e) {
    document.getElementById("rosterLine").textContent = String(e.message || e);
  }
}

function encodeWav(float32, rate) {
  const n = float32.length;
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const ascii = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ascii(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); ascii(8, "WAVE"); ascii(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); ascii(36, "data");
  v.setUint32(40, n * 2, true);
  let o = 44;
  for (let i = 0; i < n; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], {type: "audio/wav"});
}

function newCtx() {
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) throw new Error("this browser has no AudioContext");
  return new C();
}

function paintLevel(samples) {
  const c = document.getElementById("recWave");
  const g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const bars = 40;
  const bw = c.width / bars;
  for (let i = 0; i < bars; i++) {
    const v = Math.abs(samples[Math.floor(i * samples.length / bars)] || 0);
    const h = Math.max(3, v * c.height);
    g.fillStyle = v > 0.08 ? "#3dba7a" : "#2a2b30";
    g.fillRect(i * bw + 1, (c.height - h) / 2, bw - 2, h);
  }
}

function startClock() {
  stopClock();
  const el = document.getElementById("recTime");
  recStarted = Date.now();
  const t0 = recStarted;
  el.textContent = "0:00";
  recClock = setInterval(() => {
    const s = Math.min(99, Math.floor((Date.now() - t0) / 1000));
    el.textContent = `0:${String(s).padStart(2, "0")}`;
  }, 200);
}

function stopClock() {
  if (recClock) clearInterval(recClock);
  recClock = null;
}

async function openCam() {
  Umbra.boot();
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("Camera is blocked on this URL. Use HTTPS or http://127.0.0.1:8765/enroll");
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {width: {ideal: 1280}, height: {ideal: 720}}, audio: true});
  } catch (e) {
    stream = await navigator.mediaDevices.getUserMedia({video: {width: {ideal: 1280}, height: {ideal: 720}}, audio: false}).catch(() => { throw e; });
  }
  const v = document.getElementById("camPreview");
  v.muted = true;
  v.playsInline = true;
  v.srcObject = new MediaStream(stream.getVideoTracks());
  hide(document.getElementById("guide"), false);
  const ph = document.querySelector(".oval-asset");
  if (ph) ph.hidden = true;
  try { await v.play(); } catch (e) { showErr(e); }
}

async function tickQa() {
  if (qaBusy || !stream) return;
  if (step === "face" && bag.face.length >= FACE_NEED) return;
  if (step !== "face" && !(step === "voice" && voiceUI === "rec")) return;
  qaBusy = true;
  const guide = document.getElementById("guide");
  try {
    const blob = await Umbra.grabCover(document.getElementById("camPreview"));
    const q = blob ? await Umbra.qaFace(blob, FACE_POSES[bag.face.length] || "front") : null;
    guide.classList.toggle("ok", !!(q && q.ok && q.face));
  } catch (e) {
    guide.classList.remove("ok");
  } finally {
    qaBusy = false;
  }
}

async function snap(kind) {
  document.getElementById("stage").classList.remove("rest");
  const v = document.getElementById("camPreview");
  if (!v.srcObject) throw new Error("camera is not on");
  const blob = await Umbra.grabFrame(v);
  if (!blob) throw new Error("no frame yet — wait a moment and try again");
  bag[kind].push(blob);
  render();
}

function acceptVoice(wav) {
  voiceTok += 1;
  stopClock();
  document.getElementById("stopVoice").onclick = null;
  bag.voice = [wav];
  setPlayback(wav);
  voiceUI = "done";
  render();
}

async function fileToWav(file) {
  const ctx = newCtx();
  await ctx.resume();
  const buf = await ctx.decodeAudioData(await file.arrayBuffer());
  const wav = encodeWav(buf.getChannelData(0), buf.sampleRate);
  await ctx.close();
  if (!wav || wav.size < 1000) throw new Error("that audio file is empty");
  return wav;
}

async function recordVoice() {
  const tok = ++voiceTok;
  showErr("");
  recStarted = 0;
  voiceUI = "rec";
  render();
  document.getElementById("recLabel").textContent = "Recording";
  document.getElementById("stopVoice").textContent = "Stop";
  let endRec;
  const stopped = new Promise((r) => { endRec = r; });
  document.getElementById("stopVoice").onclick = () => {
    if (!recStarted) {
      voiceTok += 1;
      voiceUI = "idle";
      render();
      endRec();
      return;
    }
    if (Date.now() - recStarted < VOICE_MIN_MS) {
      showErr("keep talking — need 12 seconds of clear speech");
      return;
    }
    endRec();
  };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("no mic — use Choose voice file");
  }
  if (!stream || !stream.getAudioTracks().some((t) => t.readyState === "live")) {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
    await Promise.race([openCam(), stopped.then(() => null)]);
  }
  if (tok !== voiceTok) return;
  const live = stream && stream.getAudioTracks().find((t) => t.readyState === "live");
  if (!live) throw new Error("no mic — allow microphone for 127.0.0.1, or use Choose voice file");
  const mic = new MediaStream([live.clone ? live.clone() : live]);
  readFaces = [];
  stopReadGrabs();
  const snapRead = () => {
    if (tok !== voiceTok || readFaces.length >= READ_FACE_MAX) return;
    Umbra.grabFrame(document.getElementById("camPreview")).then((b) => {
      if (b && tok === voiceTok && readFaces.length < READ_FACE_MAX) readFaces.push(b);
    }).catch(() => {});
  };
  snapRead();
  readGrab = setInterval(snapRead, READ_FACE_MS);
  let ctx = null, an = null;
  try {
    ctx = newCtx();
    ctx.resume();
    an = ctx.createAnalyser();
    an.fftSize = 2048;
    const mute = ctx.createGain();
    mute.gain.value = 0;
    ctx.createMediaStreamSource(mic).connect(an);
    an.connect(mute);
    mute.connect(ctx.destination);
  } catch (e) {
    an = null;
  }
  const chunks = [];
  const rec = new MediaRecorder(mic);
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  const flushed = new Promise((r) => { rec.onstop = r; rec.onerror = r; });
  rec.start();
  startClock();
  const auto = setTimeout(endRec, VOICE_MS);
  const wave = new Float32Array(an ? an.fftSize : 0);
  const meter = () => {
    if (tok !== voiceTok || rec.state !== "recording") return;
    an.getFloatTimeDomainData(wave);
    paintLevel(wave);
    requestAnimationFrame(meter);
  };
  if (an) meter();
  await stopped;
  clearTimeout(auto);
  stopReadGrabs();
  stopClock();
  if (rec.state !== "inactive") rec.stop();
  await Promise.race([flushed, new Promise((r) => setTimeout(r, 3000))]);
  if (ctx) try { await ctx.close(); } catch (e) {}
  mic.getTracks().forEach((t) => t.stop());
  if (tok !== voiceTok) return;
  if (!chunks.length) throw new Error("no audio — speak, or use Choose voice file");
  const wav = await fileToWav(new Blob(chunks, {type: rec.mimeType}));
  const q = await Umbra.qaVoice(wav);
  if (!q.ok) throw new Error(q.reason || "voice quality");
  acceptVoice(wav);
}

function clearCategory() {
  if (step === "face") bag.face = [];
  if (step === "voice") {
    bag.voice = [];
    stopReadGrabs();
    readFaces = [];
    voiceUI = "idle";
    setPlayback(null);
  }
  render();
}

async function saveEncrypted() {
  if (step === "face") {
    if (bag.face.length < FACE_NEED) throw new Error("need 3 face angles");
    voiceUI = "idle";
    step = "voice";
    render();
    return;
  }
  if (step !== "voice") return;
  if (voiceUI !== "done" || bag.voice.length < VOICE_NEED) throw new Error("need the voice passage");
  const fd = new FormData();
  bag.face.concat(readFaces).forEach((b, i) => fd.append("face", b, `face${i}.jpg`));
  bag.voice.forEach((b, i) => fd.append("voice", b, `voice${i}.wav`));
  const pidEl = document.getElementById("pid");
  if (pidEl && pidEl.value.trim()) fd.append("id", pidEl.value.trim());
  const btn = document.getElementById("doEnroll");
  const nFace = bag.face.length + readFaces.length;
  const items = [
    {id: "face", label: "F", name: "face ×" + nFace, eta: nFace * 1100},
    {id: "voice", label: "V", name: "voice", eta: bag.voice.length * 1100},
  ];
  document.getElementById("enrollHint").textContent = "Encrypting on this machine. Key stays here.";
  btn.disabled = true;
  Umbra.paintLanes(document.getElementById("lights"), {mode: "run", items});
  try {
    const out = await Umbra.enroll(fd);
    Umbra.paintLanes(document.getElementById("lights"), {mode: "done", items: items.map((it) => Object.assign({}, it, {ok: true}))});
    enrolledId = out.id;
    Umbra.session.set({ id: out.id, at: Date.now() });
    stopCam();
    step = "done";
    render();
  } catch (e) {
    Umbra.paintLanes(document.getElementById("lights"), {mode: "done", items: items.map((it) => Object.assign({}, it, {ok: false}))});
    throw e;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("begin").onclick = () => openCam().then(() => { step = "face"; render(); }).catch(showErr);
document.getElementById("snapFace").onclick = () => snap("face").catch(showErr);
function recFailed(e) {
  voiceTok += 1;
  stopReadGrabs();
  stopClock();
  showErr(e);
  document.getElementById("recLabel").textContent = "Couldn’t record";
  const btn = document.getElementById("stopVoice");
  btn.textContent = "Retry";
  btn.onclick = () => recordVoice().catch(recFailed);
}
document.getElementById("recVoice").onclick = () => recordVoice().catch(recFailed);
document.getElementById("voiceFile").onchange = (ev) => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!f) return;
  fileToWav(f).then(async (wav) => {
    const q = await Umbra.qaVoice(wav);
    if (!q.ok) throw new Error(q.reason || "voice quality");
    acceptVoice(wav);
  }).catch(showErr);
};
document.getElementById("clearCat").onclick = () => clearCategory();
document.getElementById("doEnroll").onclick = () => saveEncrypted().catch(showErr);
document.getElementById("enter").onclick = () => {
  if (!enrolledId) return;
  location.assign("index.html?enrolled=" + encodeURIComponent(enrolledId));
};
rosterLine();
render();
setInterval(tickQa, 400);
</script>
</body>
</html>
