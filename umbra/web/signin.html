<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Umbra — do this</title>
  <link rel="stylesheet" href="/style.css?v=qa5">
  <style>
    .bit.run, .lights.busy .bit {
      background:#e4b42a; color:#1a1404;
      animation: bitpulse 0.75s ease-in-out infinite;
    }
    @keyframes bitpulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(228,180,42,0.75); }
      50% { transform: scale(1.28); box-shadow: 0 0 14px 5px rgba(228,180,42,0.55); }
    }
    video.mirror { transform: scaleX(-1); }
  </style>
</head>
<body>
<main>
  <h1>Sign in</h1>
  <nav class="muted"><a href="/">Back</a></nav>
  <section class="card">
    <strong>Do this</strong>
    <p id="say"></p>
    <p id="act">Fill the oval (close, centered, bright). Then record: say the words and wave your hand across your face.</p>
    <div id="stage" hidden>
      <video id="cam" class="mirror" playsinline muted autoplay></video>
      <div id="guide"><div class="oval"></div></div>
    </div>
    <div class="row">
      <button type="button" id="rec" disabled>Record</button>
      <button type="button" id="send">Send</button>
    </div>
    <div class="lights" id="lights"></div>
    <p class="muted" id="status"></p>
    <p id="err"></p>
  </section>
</main>
<script src="/umbra.js?v=qa4"></script>
<script>
let stream = null;
let rec = null;
let take = null;
let recording = false;
let card = null;
let pid = "";
let locked = false;
let qaBusy = false;
const LIGHTS = ["face", "voice", "words", "wave"];
const LIGHT_LABEL = {face: "S3", voice: "S2", words: "S1", wave: "LV"};

function paintLights(state, bits) {
  const box = document.getElementById("lights");
  box.className = state === "run" ? "lights busy" : "lights";
  box.innerHTML = "";
  LIGHTS.forEach((id, i) => {
    const d = document.createElement("div");
    d.className = "bit" + (state === "run" ? " run" : "");
    d.textContent = LIGHT_LABEL[id];
    d.title = id;
    if (state === "done" && bits) d.classList.add(bits[i] === 1 ? "on" : "off");
    box.appendChild(d);
  });
}

function showErr(e) {
  document.getElementById("err").textContent = String(e && e.message ? e.message : e);
}

function setLocked(on, reason) {
  locked = !!on;
  document.getElementById("guide").classList.toggle("ok", locked);
  document.getElementById("rec").disabled = !locked && !recording;
  if (!recording) {
    document.getElementById("status").textContent = locked
      ? "Locked. Record, say the words, wave your hand across your face."
      : (reason || "Fill the oval — close, centered, well lit.");
  }
}

function grabJpeg() {
  return Umbra.grabCover(document.getElementById("cam"));
}

async function tickQa() {
  if (recording || qaBusy || !stream) return;
  qaBusy = true;
  try {
    const blob = await grabJpeg();
    if (!blob) return;
    const q = await Umbra.qaFace(blob, "front");
    setLocked(q.ok, q.reason);
  } catch (e) {
    setLocked(false, String(e && e.message ? e.message : e));
  } finally {
    qaBusy = false;
  }
}

async function boot() {
  const rost = await Umbra.roster();
  if (!(rost.people || []).length) {
    location.replace("/");
    return;
  }
  pid = rost.people[rost.people.length - 1].id;
  card = await Umbra.card();
  document.getElementById("say").textContent = "Say: " + card.say;
  document.getElementById("act").textContent =
    "Fill the oval (close, centered, bright). Then record: say those words and wave your hand across your face.";
  document.getElementById("status").textContent = "Signing in as " + pid + ". Open the camera and fill the oval.";
  paintLights("idle");
}

async function openCam() {
  if (stream) return stream;
  if (!/^(127\.0\.0\.1|localhost)$/.test(location.hostname) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("Camera is blocked on this URL. Open http://127.0.0.1:8765/signin");
  }
  document.getElementById("stage").hidden = false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: true, audio: false});
  } catch (e) {
    throw new Error("Camera blocked. Allow camera for 127.0.0.1 in the address bar (or Safari → Settings → Websites → Camera), then try again.");
  }
  try {
    const mic = await navigator.mediaDevices.getUserMedia({audio: true, video: false});
    mic.getAudioTracks().forEach((t) => stream.addTrack(t));
  } catch (e) {}
  const v = document.getElementById("cam");
  v.muted = true;
  v.playsInline = true;
  v.srcObject = stream;
  try { await v.play(); } catch (e) { showErr(e); }
  setInterval(tickQa, 450);
  tickQa();
  return stream;
}

document.getElementById("rec").onclick = () => {
  showErr("");
  if (recording) {
    recording = false;
    if (rec && rec.state !== "inactive") rec.stop();
    document.getElementById("rec").textContent = "Record";
    document.getElementById("status").textContent = "Take saved. Send: face+voice FHE, words on this laptop, wave = face came back as you.";
    return;
  }
  if (!locked) {
    showErr("lock the oval first — close, centered, well lit");
    return;
  }
  openCam().then((s) => {
    const chunks = [];
    try {
      rec = new MediaRecorder(s);
    } catch (e) {
      showErr(e);
      return;
    }
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => { take = new Blob(chunks); };
    rec.start(200);
    recording = true;
    take = null;
    document.getElementById("rec").textContent = "Stop";
    document.getElementById("rec").disabled = false;
    document.getElementById("status").textContent = "Recording — say the words, wave across your face, then look back into the oval.";
  }).catch(showErr);
};

function stopRec() {
  if (!recording) return Promise.resolve();
  recording = false;
  document.getElementById("rec").textContent = "Record";
  if (!rec || rec.state === "inactive") return Promise.resolve();
  return new Promise((r) => {
    const prev = rec.onstop;
    rec.onstop = (ev) => {
      if (prev) prev(ev);
      r();
    };
    rec.stop();
  });
}

document.getElementById("send").onclick = () => {
  showErr("");
  stopRec().then(() => {
    if (!take || !take.size) throw new Error("record first");
    paintLights("run");
    document.getElementById("status").textContent = "Face frames → Vultr FHE. Words stay on this laptop.";
    document.getElementById("send").disabled = true;
    const fd = new FormData();
    fd.append("take", take, "take.webm");
    fd.append("card", JSON.stringify(card || {}));
    fd.append("id", pid);
    return Umbra.verify(fd);
  }).then((out) => {
    paintLights("done", out.bits);
    const ms = out.ms || {};
    const face = (out.lanes || {}).face || {};
    const voice = (out.lanes || {}).voice || {};
    const words = (out.lanes || {}).words || {};
    const th = out.thresh || {};
    const fl = face.l2 == null ? "—" : Number(face.l2).toFixed(1);
    const vl = voice.l2 == null ? "—" : Number(voice.l2).toFixed(2);
    document.getElementById("status").textContent =
      (out.ok ? "Pass " + out.id + "." : "Finished. Green = that check passed.") +
      " Face L2 " + fl + " / " + (th.face || "?") +
      ". Voice L2 " + vl + " / " + (th.voice || "?") +
      (words.text ? ". Heard: " + words.text : "") +
      ". " + (ms.total || 0) + " ms";
  }).catch(showErr).finally(() => {
    document.getElementById("send").disabled = false;
  });
};

boot().then(openCam).catch(showErr);
</script>
</body>
</html>
