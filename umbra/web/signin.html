<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Umbra — do this</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/style.css?v=face7">
</head>
<body class="desktop face-page" data-bg="face">
<div data-umbra-bg></div>
<div class="desk face-desk">
  <article class="win face-wire" data-win="face" data-win-preset="face">
    <div class="win-bar face-wire-bar">
      <h2>Face</h2>
      <div class="win-chrome">
        <button type="button" data-win-min aria-label="Minimize">-</button>
        <a class="win-btn face-x" href="/" aria-label="Close">X</a>
      </div>
    </div>
    <div class="face-view" id="stage">
      <video id="cam" class="mirror" playsinline muted autoplay></video>
      <div id="guide" hidden><div class="oval"></div></div>
      <img class="oval-asset" id="ovalPlaceholder" src="/assets/oval.svg" width="417" height="535" alt="">
    </div>
    <div class="face-foot">
      <p id="act">
        Place your face until it fully fits the ellipse.<br>
        Hit record. Say the phrase: <span id="say">_________________________</span><br>
        Stop recording. Send.
      </p>
      <div class="face-btns">
        <button type="button" id="rec" disabled>Record</button>
        <button type="button" id="send">Send</button>
        <button type="button" id="skipHome" class="skip-home">Skip to home</button>
      </div>
    </div>
    <div class="lights" id="lights"></div>
    <div class="win-resize" aria-hidden="true"></div>
  </article>
</div>
<script src="/umbra.js?v=qa4"></script>
<script src="/vendor/grain.js"></script>
<script src="/windows.js?v=wire5"></script>
<script>
let stream = null;
let rec = null;
let take = null;
let recording = false;
let card = null;
let pid = "";
let locked = false;
let qaBusy = false;
const LIGHTS = ["face", "voice", "words", "wave"];
const LIGHT_LABEL = {face: "S3", voice: "S2", words: "S1", wave: "LV"};

function paintLights(state, bits) {
  const box = document.getElementById("lights");
  box.className = state === "run" ? "lights busy" : "lights";
  box.innerHTML = "";
  LIGHTS.forEach((id, i) => {
    const d = document.createElement("div");
    d.className = "bit" + (state === "run" ? " run" : "");
    d.textContent = LIGHT_LABEL[id];
    d.title = id;
    if (state === "done" && bits) d.classList.add(bits[i] === 1 ? "on" : "off");
    box.appendChild(d);
  });
}

function showErr(e) {
  if (e) console.error(e && e.message ? e.message : e);
}

function setLocked(on, reason) {
  locked = !!on;
  document.getElementById("guide").classList.toggle("ok", locked);
  if (!recording && stream) document.getElementById("rec").disabled = false;
  if (reason) console.debug(reason);
}

function grabJpeg() {
  return Umbra.grabCover(document.getElementById("cam"));
}

async function tickQa() {
  if (recording || qaBusy || !stream) return;
  qaBusy = true;
  try {
    const blob = await grabJpeg();
    if (!blob) return;
    const q = await Umbra.qaFace(blob, "front");
    setLocked(q.ok, q.reason);
  } catch (e) {
    setLocked(false, String(e && e.message ? e.message : e));
  } finally {
    qaBusy = false;
  }
}

async function boot() {
  paintLights("idle");
  try {
    const rost = await Umbra.roster();
    const people = rost.people || [];
    if (!people.length) {
      console.info("roster empty");
    } else {
      pid = people[people.length - 1].id;
      const sess = Umbra.session.get();
      if (sess && sess.id && people.some((p) => p.id === sess.id)) pid = sess.id;
      console.info("signing in as", pid);
    }
  } catch (e) {
    showErr(e);
  }
  try {
    card = await Umbra.card();
    document.getElementById("say").textContent = "Say: " + card.say;
  } catch (e) {
    showErr(e);
  }
}

async function openCam() {
  if (stream) return stream;
  const v = document.getElementById("cam");
  stream = await Umbra.openCam(v);
  await Umbra.withMic(stream);
  document.getElementById("ovalPlaceholder").hidden = true;
  document.getElementById("guide").hidden = false;
  document.getElementById("rec").disabled = false;
  setInterval(tickQa, 450);
  tickQa();
  return stream;
}

document.getElementById("rec").onclick = () => {
  showErr("");
  if (recording) {
    recording = false;
    if (rec && rec.state !== "inactive") rec.stop();
    document.getElementById("rec").textContent = "Record";
    console.info("take saved");
    return;
  }
  if (!stream) {
    showErr("camera is not on");
    return;
  }
  openCam().then((s) => {
    const chunks = [];
    try {
      rec = new MediaRecorder(s);
    } catch (e) {
      showErr(e);
      return;
    }
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => { take = new Blob(chunks); };
    rec.start(200);
    recording = true;
    take = null;
    document.getElementById("rec").textContent = "Stop";
    document.getElementById("rec").disabled = false;
  }).catch(showErr);
};

function stopRec() {
  if (!recording) return Promise.resolve();
  recording = false;
  document.getElementById("rec").textContent = "Record";
  if (!rec || rec.state === "inactive") return Promise.resolve();
  return new Promise((r) => {
    const prev = rec.onstop;
    rec.onstop = (ev) => {
      if (prev) prev(ev);
      r();
    };
    rec.stop();
  });
}

document.getElementById("send").onclick = () => {
  showErr("");
  stopRec().then(() => {
    if (!take || !take.size) throw new Error("record first");
    paintLights("run");
    document.getElementById("send").disabled = true;
    const fd = new FormData();
    fd.append("take", take, "take.webm");
    fd.append("card", JSON.stringify(card || {}));
    fd.append("id", pid);
    return Umbra.verify(fd);
  }).then((out) => {
    paintLights("done", out.bits);
    const ms = out.ms || {};
    const face = (out.lanes || {}).face || {};
    const voice = (out.lanes || {}).voice || {};
    const words = (out.lanes || {}).words || {};
    const th = out.thresh || {};
    const fl = face.l2 == null ? "—" : Number(face.l2).toFixed(1);
    const vl = voice.l2 == null ? "—" : Number(voice.l2).toFixed(2);
    console.info("verify", {
      ok: out.ok,
      id: out.id,
      faceL2: fl,
      voiceL2: vl,
      thresh: th,
      heard: words.text || "",
      ms: ms.total || 0,
    });
    if (out.ok) {
      Umbra.session.set({ id: out.id || pid, at: Date.now() });
      setTimeout(() => location.assign("/home"), 900);
    }
  }).catch(showErr).finally(() => {
    document.getElementById("send").disabled = false;
  });
};

boot().then(openCam).catch(showErr);
document.getElementById("skipHome").onclick = () => {
  Umbra.session.set({ id: pid || (Umbra.session.get() || {}).id || "guest", at: Date.now() });
  location.assign("/home");
};
</script>
</body>
</html>
